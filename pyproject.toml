[project]
name = "daily-living-skills-tools"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = ["elephant-goldfish-model", "_bmad"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tools"]
addopts = "--import-mode=importlib"
