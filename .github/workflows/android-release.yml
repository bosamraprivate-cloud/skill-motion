# Builds the signed arm64 tester APK and publishes it as a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
name: Android release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          DLS_KEYSTORE_BASE64: ${{ secrets.DLS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DLS_KEYSTORE_BASE64" ]; then echo "Missing DLS_KEYSTORE_BASE64 secret" >&2; exit 1; fi
          echo "$DLS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="0.1.0-build${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK (arm64)
        env:
          DLS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DLS_KEYSTORE_PASSWORD: ${{ secrets.DLS_KEYSTORE_PASSWORD }}
          DLS_KEY_ALIAS: ${{ secrets.DLS_KEY_ALIAS }}
          DLS_KEY_PASSWORD: ${{ secrets.DLS_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --no-daemon
          -Pdls.arm64Only=true
          -Pdls.versionCode=${{ github.run_number }}
          -Pdls.versionName=${{ steps.ver.outputs.name }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Skillmotion-${{ steps.ver.outputs.name }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Skillmotion-${{ steps.ver.outputs.name }}
          path: android/dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Skillmotion ${{ steps.ver.outputs.name }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: android/dist/*.apk
